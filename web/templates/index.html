<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Duplicator – Duplicate Finder</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3">
    <span class="navbar-brand mb-0 h1">
        <i class="bi bi-files"></i> File Duplicator
    </span>
</nav>

<div class="container-fluid px-3 py-3">

    <!-- Directory picker -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <label class="form-label fw-bold mb-1">Directory</label>
            <div class="input-group">
                <input id="dirInput" type="text" class="form-control" placeholder="/volume1/data">
                <button id="browseBtn" class="btn btn-outline-secondary" type="button">
                    <i class="bi bi-folder2-open"></i> Browse
                </button>
            </div>
        </div>
    </div>

    <!-- Scan options -->
    <div class="card mb-3">
        <div class="card-body py-2">
            <div class="row g-2 align-items-center">
                <div class="col-auto"><span class="fw-bold">Match by:</span></div>
                <div class="col-auto form-check">
                    <input id="chkName" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="chkName">Name</label>
                </div>
                <div class="col-auto form-check">
                    <input id="chkSize" class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label" for="chkSize">Size</label>
                </div>
                <div class="col-auto form-check">
                    <input id="chkHash" class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label" for="chkHash">Hash (content)</label>
                </div>
                <div class="col-auto form-check">
                    <input id="chkRecursive" class="form-check-input" type="checkbox" checked>
                    <label class="form-check-label" for="chkRecursive">Recursive</label>
                </div>
                <div class="col-auto ms-auto">
                    <label class="form-label mb-0 me-1">Min size:</label>
                </div>
                <div class="col-auto">
                    <select id="minSize" class="form-select form-select-sm" style="width:auto">
                        <option value="0">0 B (all)</option>
                        <option value="1B">1 B</option>
                        <option value="1KB" selected>1 KB</option>
                        <option value="1MB">1 MB</option>
                        <option value="10MB">10 MB</option>
                        <option value="100MB">100 MB</option>
                        <option value="1GB">1 GB</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Action buttons -->
    <div class="d-flex gap-2 mb-3">
        <button id="scanBtn" class="btn btn-primary flex-grow-1 fw-bold py-2">
            <i class="bi bi-search"></i> Scan for Duplicates
        </button>
        <button id="cancelBtn" class="btn btn-outline-secondary py-2" disabled>Cancel</button>
    </div>

    <!-- Progress -->
    <div id="progressArea" class="mb-3 d-none">
        <div class="d-flex align-items-center gap-2 mb-1">
            <span id="phaseLabel" class="text-muted small"></span>
            <span id="progressText" class="text-muted small ms-auto"></span>
        </div>
        <div class="progress" style="height: 8px">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
        </div>
    </div>

    <!-- Results -->
    <div id="resultsArea" class="d-none">
        <!-- Summary -->
        <div id="summaryBar" class="alert alert-info d-flex align-items-center mb-3 py-2"></div>

        <!-- Bulk actions -->
        <div class="d-flex gap-2 mb-2 flex-wrap">
            <button id="autoSelectBtn" class="btn btn-sm btn-outline-warning">
                <i class="bi bi-check2-all"></i> Select All Newer as Delete
            </button>
            <button id="deselectBtn" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Deselect All
            </button>
            <div class="ms-auto">
                <button id="deleteBtn" class="btn btn-sm btn-danger fw-bold">
                    <i class="bi bi-trash3"></i> Delete Selected
                </button>
            </div>
        </div>

        <!-- Groups container -->
        <div id="groupsContainer"></div>
    </div>
</div>

<!-- Browse modal -->
<div class="modal fade" id="browseModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content bg-dark">
            <div class="modal-header py-2">
                <h6 class="modal-title"><i class="bi bi-folder2-open"></i> Browse Directory</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div class="px-3 py-2 border-bottom border-secondary">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text">Path</span>
                        <input id="browsePathInput" type="text" class="form-control" value="/">
                        <button id="browseGoBtn" class="btn btn-outline-primary btn-sm">Go</button>
                    </div>
                </div>
                <div id="browseDirList" class="list-group list-group-flush" style="max-height:400px;overflow-y:auto"></div>
            </div>
            <div class="modal-footer py-2">
                <button id="browseSelectBtn" class="btn btn-primary btn-sm">Select This Directory</button>
            </div>
        </div>
    </div>
</div>

<!-- Confirm delete modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark">
            <div class="modal-header py-2 text-danger">
                <h6 class="modal-title"><i class="bi bi-exclamation-triangle-fill"></i> Confirm Deletion</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="deleteMsg"></p>
                <p class="text-danger fw-bold mb-0">This action CANNOT be undone.</p>
            </div>
            <div class="modal-footer py-2">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-sm btn-danger">
                    <i class="bi bi-trash3"></i> Delete Permanently
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
